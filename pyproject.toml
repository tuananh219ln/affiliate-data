[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "affiliate-data"
version = "0.1.0"
description = "Collects Shopee and TikTok product, trend, link and commission data for affiliate work, behind a small API."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "cryptography>=44",
    # Must match the browser build in the Docker base image (Dockerfile).
    "playwright==1.55.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.15"]

[project.scripts]
affiliate-data = "affiliate_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
