{% extends "base.html" %}
{% block title %}Tài khoản{% endblock %}
{% block content %}
<h1>Tài khoản</h1>
<p>{{ user.name }} · {{ user.email }}{% if user.is_admin %} · Quản trị{% endif %}</p>
<h2>Đổi mật khẩu</h2>
<form class="panel" method="post" action="/account/password" style="max-width: 420px;">
  <p><label for="current">Mật khẩu hiện tại</label><input id="current" name="current" type="password" required autocomplete="current-password"></p>
  <p><label for="new">Mật khẩu mới (ít nhất 10 ký tự)</label><input id="new" name="new" type="password" required minlength="10" autocomplete="new-password"></p>
  <button class="primary" type="submit">Đổi mật khẩu</button>
  <p class="muted" style="font-size: 14px;">Đổi mật khẩu sẽ đăng xuất bạn trên các thiết bị khác.</p>
</form>
{% endblock %}
