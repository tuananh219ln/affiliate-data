{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<div class="panel" style="max-width: 380px; margin: 48px auto;">
  <h1>Đăng nhập</h1>
  <form method="post" action="/login">
    <p><label for="email">Email</label><input id="email" name="email" type="email" value="{{ email or '' }}" required autofocus autocomplete="username"></p>
    <p><label for="password">Mật khẩu</label><input id="password" name="password" type="password" required autocomplete="current-password"></p>
    <button class="primary" type="submit">Đăng nhập</button>
  </form>
  <p class="muted" style="font-size: 14px;">Chưa có tài khoản? Nhờ quản trị viên thêm bạn.</p>
</div>
{% endblock %}
