{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block signed_out %}
<main class="signin">
  <div class="card">
    <div class="logo">{{ ui.logo_mark() }}Affiliate Data</div>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" value="{{ email or '' }}" required autofocus autocomplete="username"></div>
      <div class="field"><label for="password">Mật khẩu</label><input id="password" name="password" type="password" required autocomplete="current-password"></div>
      <button class="btn btn-primary" type="submit" style="width: 100%;">Đăng nhập</button>
    </form>
    <p class="muted" style="margin: 16px 0 0; text-align: center;">Chưa có tài khoản? Nhờ quản trị viên thêm bạn.</p>
  </div>
</main>
{% endblock %}
